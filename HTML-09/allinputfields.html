<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form >
        <input type="button" value="Button"><br><br>
        <input type="checkbox" placeholder="Check me"><br><br>
        <input type="color" placeholder="Choose a color"><br><br>
        <input type="date" placeholder="Select a date"><br><br>
        <input type="datetime-local" placeholder="Select a date and time"><br><br>
        <input type="email" placeholder="Enter your email"><br><br>
        <input type="file" placeholder="Choose a file"><br><br>
        <input type="hidden" placeholder="Hidden field"><br><br>
        <input type="image" placeholder="Image button"><br><br>
        <input type="month" placeholder="Select a month"><br><br>
        <input type="number" placeholder="Enter a number"><br><br>
        <input type="password" placeholder="Enter your password"><br><br>
        <input type="radio" placeholder="Select an option"><br><br>
        <input type="range" placeholder="Adjust the slider"><br><br>
        <input type="reset" placeholder="Reset the form"><br><br>
        <input type="search" placeholder="Search..."><br><br>
        <input type="submit" placeholder="Submit the form"><br><br>
        <input type="tel" placeholder="Enter your phone number"><br><br>
        <input type="text" placeholder="Enter your name"><br><br>
        <input type="time" placeholder="Select a time"><br><br>
        <input type="url" placeholder="Enter a URL"><br><br>
        <input type="week" placeholder="Select a week">
    </form>
</body>
</html>
