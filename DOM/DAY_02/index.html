<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p class="para">This is demo para</p>


    <script>
        let para=document.querySelector(".para");

        function changePara()
        {
            para.innerHTML="we successfully change the para";
            para.style.color="red";
            para.style.backgroundColor="skyblue";
        }

        para.addEventListener("click",changePara);
    </script>
</body>
</html>
