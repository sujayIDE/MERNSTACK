<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .para{
            background-color: yellow;
            color: red;
            padding: 20px;
            border-radius: 20px;
            border: solid;
            align-content: center;
            font-size: 3rem;
        }
    </style>
</head>
<body>
    <p class="para">This is demo para</p>
    <button class="togglebtn">toggle</button>

    <script>
       let para=document.querySelector(".para");
       let toggleBtn=document.querySelector(".togglebtn");

       function toggleCss(className)
       {
        para.classList.toggle(className);
       }

       function togglePara()
       {
        let isPresent=para.classList.contains("para");
        toggleCss("para");


        if(isPresent)
       {
        para.innerHTML="para class is not present";
       }else{
        para.innerHTML="para class is present";
       }
       }

       toggleBtn.addEventListener("click",togglePara);
    </script>
</body>
</html>
