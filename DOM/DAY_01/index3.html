<!DOCTYPE html>
<html>
<head>
    <title>Button Example</title>
</head>
<body>

    <button class="btn_3">btn_03</button>

    <script>
        let btn_03 = document.querySelector(".btn_3");

        let fun_03 = () => {
            btn_03.innerHTML = "btn_03 is working";
        };

        btn_03.addEventListener("click", fun_03);
    </script>

</body>
</html>
