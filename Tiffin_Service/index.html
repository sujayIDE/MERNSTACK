<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tiffin-Service-Sujay-Chimane-1.0</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="mainWrapper">
      <!-- header -->
      <header>
        <p>LOGO</p>
        <nav>
          <a href="#">Home</a>
          <a href="#">Menu</a>
          <a href="#">Plans</a>
          <a href="#">About</a>
        </nav>
        <button type="submit">Login</button>
      </header>

      <!-- HeroSection -->
      <section class="heroSection">
        <section class="text">
        <h1>Fresh & Healthy <br />
            Tiffin Service <br /></h1>
            <p>Homemade food, delivered with love</p>

          <button>Order Now</button>
        </section>
        <img src="thali.png" alt="thali image" />
      </section>

    <section class="menuSection">

    <h2>Today's Menu</h2>

    <div class="tiffin-grid">

        <article class="child">
            <img src="thali.png" alt="Veg Thali">
            <h3>Veg Thali</h3>
            <p>₹120</p>
            <button>Order Now</button>
        </article>

        <article class="child">
            <img src="thali.png" alt="Special Thali">
            <h3>Special Thali</h3>
            <p>₹180</p>
            <button>Order Now</button>
        </article>

        <article class="child">
            <img src="thali.png" alt="Mini Thali">
            <h3>Mini Thali</h3>
            <p>₹90</p>
            <button>Order Now</button>
        </article>

        <!-- 3 more cards -->

    </div>

</section>
    </main>
  </body>
</html>
