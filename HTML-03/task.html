<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heading tags, image tags, link tags</title>
  </head>
  <body>
    <!--     1. create headings with the heading tags rule -->
    <h1>This is my heading</h1>
    <h2>This is my sub heading</h2>
    <h3>This is my sub subheading</h3>
    <h3>This is my sub subheading</h3>
    <h3>This is my sub subheading</h3>
    <h3>This is my sub subheading</h3>
    <h3>This is my sub subheading</h3>
    <h3>This is my sub subheading</h3>

    <!-- >> with correct src value  -->
     <img src="images.png" alt="" height="200">

    <!-- >> with wrong src value + alt  -->
     <img src="jav.jpg" alt="java image" height="200">

     <!-- >> with  src="url" -->
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQNX_5UseULRQhsg6henbWeyeIAZ0a1bLo55pIt-itcjA&s=10" height="200"><br>

      <!-- Add the 2 links 
        >> open in the same  -->
        <a href="http://www.google.com" target="_self">google</a> <br>

        <!-- >> open in the new tab. -->
         <a href="http://www.youtube.com" target="_blank">YouTube</a>

  </body>
</html>
