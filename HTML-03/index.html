<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
  </head>
  <body>
    <!-- How to add "heading" element on html webpage 
    >> 6 tags h1, h2, h3, h4, h5, h6 -->
    <h1>This is the main heading</h1>
    <h2>This is a subheading</h2>
    <h3>This is a sub-subheading</h3>
    <h4>This is a sub-sub-subheading</h4>
    <h5>This is a sub-sub-sub-subheading</h5>
    <h6>This is a sub-sub-sub-sub-subheading</h6>

    <!--How to add "paragraph" in html webpage 
     >> p tag -->
    <p>This is a simple paragraph.</p>

    <!-- How to add "image" in html webpage  -->
    <!-- local image -->
    <img src="images.png" alt="Html logo" />

    <!-- global image url -->
    <img
      src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQS9QOoVZQWjqJE7rgR-lIXJ63Cihxsuia-QNo8gk4LAg&s=10"
      alt="image address [global url]"
    />

    <img
      src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQJgeNhTSODm8fTuBEtSH3s2wezjf6SmZthTdc2ejdMzw&s=10"
      alt="Another image address [global url]"
    />
    <br>

    <!-- How to add "link" in html webpage  -->
     <a href="https://www.google.com" target="_self" >Google Home page</a>
     <a href="https://www.youtube.com" target="_blank" >YouTube</a>
  </body>
</html>

if src value is incorrect then alt value will be displayed in the webpage

syntax of a tag
<a href="url">link text</a>

-- href= it is used to hold the url of the link in the webpage click on the text it will redirect to the url address   
-- target= it is used to open the link in the same tab or new tab
-- target="_self" = open the link in the same tab
-- target="_blank" = open the link in the new tab
