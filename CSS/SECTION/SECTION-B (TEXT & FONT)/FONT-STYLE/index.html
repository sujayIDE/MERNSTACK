<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            font-style: italic;
        }

        p{
            font-style: normal;
        }

        .bold-italic{
            font-weight: bold;
            font-style:italic;
        }
    </style>
</head>
<body>
    <!-- Make a sentence italic -->
    <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Unde, repudiandae?</p>

    <!-- . Try bold + italic together. -->
     <p class="bold-italic">Lorem ipsum, dolor sit amet consectetur adipisicing elit. Expedita, cumque!</p>
</body>
</html>
