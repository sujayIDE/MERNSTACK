<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .square-box {
        width: 300px;
        height: 300px;
        background-color: violet;
        border-radius: 20px;
      }

      .circle {
        margin-top: 20px;
        width: 300px;
        height: 300px;
        background-color: violet;
        border-radius: 50%;
      }

      .card{
        margin-top: 20px;
        width: 300px;
        height: 300px;
        background-color: violet;
        border-radius: 30px 30px 0px 0px;
      }

       .box{
        margin-top: 20px;
        width: 300px;
        height: 300px;
        background-color: violet;
        border-radius: 10px 40px 50px 80px;
      }
    </style>
  </head>
  <body>
    <section class="square-box"></section>
    <section class="circle"></section>
    <section class="card"></section>
    <section class="box"></section>
  </body>
</html>
