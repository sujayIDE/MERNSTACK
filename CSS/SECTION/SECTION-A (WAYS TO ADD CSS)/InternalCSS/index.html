<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        h2 {
            color: green;
        }

        p {
            color: blue;
            text-align: center;
        }

        div {
            background-color: lightgray;
        }
    </style>
</head>

<body>

    <h2>Write internal CSS to make all &lt;h2&gt; headings green.</h2>

    <!-- Add internal CSS that gives all <p> text a blue color and center alignment. -->
    <p>Add internal CSS that gives all text a blue color and center alignment.</p>

    <!-- Use internal CSS to make all <div> elements have a lightgray background -->
    <div>
        <p>Use internal CSS to make all elements have a lightgray background.</p>
    </div>

</body>
</html>
