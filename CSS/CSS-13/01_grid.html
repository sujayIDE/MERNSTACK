<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            width: 80vw;
            height: 80vh;

            /* ========== */
            display: grid;
            grid-template-rows:50% 50%;
            grid-template-columns: 30% 30% 30%;
            grid-template-areas:    
            " box1 box2 box3 "
            " box4 box5 box6";

            /* space between the child */
            gap: 50px;
        }

        .child{
            border: solid;
        }

        /* assign the name to all child */
        #child1{
            grid-area: box1;
        }

        #child2{
            grid-area: box2;
        }

        #child3{
            grid-area: box3;
        }

        #child4{
            grid-area: box4;
        }
        
        #child5{
            grid-area: box5;
        }

        #child6{
            grid-area: box6;
        }

    </style>
</head>
<body>
    <div class="parent">
        <div id="child1" class="child"></div>
        <div id="child2" class="child"></div>
        <div id="child3" class="child"></div>
        <div id="child4" class="child"></div>
        <div id="child5" class="child"></div>
        <div id="child6" class="child"></div>
    </div>
</body>
</html>
