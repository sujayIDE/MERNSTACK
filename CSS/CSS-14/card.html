<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            width: 90vw;
            height: 90vh;
            box-sizing: border-box;
            border: solid;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin:auto;
        }

        .child{
            width: 25%;
            height: 60%;
            border: solid;
            border-radius: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: thistle;
        }

        .text{
            font-size: 30px;
            padding: 6px 20px;
            border-radius: 12px;
            border: solid; 
        }

        .text:hover{
            background-color: black;
            color: white;
            cursor: pointer;
            transition: all 0.3s linear;
        }

        @media(max-width:780px)
        {
            .parent{
                flex-direction: column;
            }

            .child{
                width: 90%;
                height: 60%;
                background-color: darkgray;
            }

            .text{
                font: 30px;
            }
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="child">
            <button class="text">Child1</button>
        </div>
        <div class="child">
            <button class="text">Child2</button>
        </div>
        <div class="child">
            <button class="text">Child3</button>
        </div>
    </div>
</body>
</html>
