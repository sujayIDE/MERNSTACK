<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <fieldset>
        <legend>User personal information</legend>

        <form action="">
            <label for="name">Enter your full name</label><br>
            <input type="text" name="name" id="'name" value="Rahul Kumar"><br><br>

            <label for="email">Enter your email</label><br>
            <input type="email" name="email" id="email" value="geeks@gmail.com"><br><br>

            <label for="password">Enter your password</label><br>
            <input type="password" name="password" id="password"><br><br>

            <label for="cpassword">Confirm your password</label><br>
            <input type="password" name="cpassword" id="cpassword"><br><br>

            <label for="gender">Enter your gender</label>
            <input type="radio" name="gender" id="male" value="male" checked>
            <label for="male">Male</label>
            <input type="radio" name="gender" id="female" value="female">
            <label for="female">Female</label>
            <input type="radio" name="others" id="others" value="others">
            <label for="others">Others</label> <br><br>

            <label for="dob">Enter your Date of Birth</label><br>
            <input type="date" name="dob" id="dob"><br><br>

            <label for="address">Enter your address</label><br>
            <textarea name="address" id="address"></textarea><br>

            <button type="submit">submit</button>

        </form>
    </fieldset>
</body>
</html>
