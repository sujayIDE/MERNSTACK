<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="mainWrapper">
      <header>
        <section class="left-box">INSECT</section>
        <input type="text" name="search" id="search" placeholder="🔍Search" />
        <nav>
          <a href="#">Home</a>
          <a href="#">Shop</a>
          <a href="#">About</a>
        </nav>
        <section class="circle"></section>
      </header>
      <article class="wrapper">
        <section class="left">
          <h2>classification</h2>
          <section class="details">
            <section class="details">
              <ul>
                <li>
                  <strong>Class:</strong>
                  <p>Insecta</p>
                </li>

                <li>
                  <strong>Order:</strong>
                  <p>Coleoptera</p>
                </li>

                <li>
                  <strong>Family:</strong>
                  <p>Cerambycidae</p>
                </li>

                <li>
                  <strong>Subfamily:</strong>
                  <p>Cerambycinae</p>
                </li>

                <li>
                  <strong>Tribe:</strong>
                  <p>Callidromatini</p>
                </li>

                <li>
                  <strong>Genu  s:</strong>
                  <p>Pachyteria</p>
                </li>
              </ul>
            </section>
          </section>
        </section>

        <section class="right">
            <section class="right-details">
                <h1>Pachyteria equestris</h1>
                <p>locality:malaysia <br>
                   sex: male</p>
                <p class="price">$5.99</p>
                   <section class="btn-grp">
                    <button class="btn-plus">- 1 +</button>
                    <button class="btn-add">ADD TO CART</button>
                   </section>
            </section>
        </section>
      </article>

      <section class="image">
        <img src="insect_cropped.png" alt="insect image" />
      </section>
    </main>
