<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="mainWrapper">
      <section class="card">
        <section class="parent">
          <section class="child">
            <img src="sujay.png" alt="" />
            <p class="name">Sujay Arjun Chimane</p>
            <p class="location">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                fill="currentColor"
                class="bi bi-geo-alt-fill"
                viewBox="0 0 16 16"
              >
                <path
                  d="M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10zm0-7a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"
                />
              </svg>
              Kolhapur, Maharashtra
            </p>
          </section>

          <section class="insight">
            <table>
                <tr>
                    <th>1k</th>
                    <th>10k</th>
                    <th>100k</th>
                </tr>

                <tr>
                    <td>Appreciations</td>
                    <td>Followers</td>
                    <td>Project Views</td>
                </tr>
            </table>
          </section>

          <section class="btn">
            <button>Message Sujay</button>
          </section>
        </section>
      </section>
    </main>
  </body>
</html>
