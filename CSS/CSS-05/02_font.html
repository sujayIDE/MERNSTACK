<!doctype html>
<html lang="en">
  <head>
    <title>Font Properties in css</title>
    <style>
        pre{
            color: rgb(89, 8, 8);

            /* change text size */
            font-size: 20px;

            /* add the width/thickness for text 
                >>100 to 900
                >>bold ,bolder, lighter & normal
            */
            font-weight: lighter;
            font-weight: bold;
            font-weight: bolder;
            font-weight: lighter;
            font-weight: normal;
            font-weight: 900 ;


            /* font family */
            font-family: serif;
            font-family: sans-serif;
            
            /* font-family: monospace;
            font-family: cursive;
            font-family: fantasy;

            font-family: Arial, Helvetica, sans-serif; */

            /* font style */
            font-style: italic;
        }
    </style>
  </head>
  <body>
    <p>
      <pre>
        What  is difference between the text and font?
        >> text -actual content/words
        >> font -it defines appearance of the text ,such as
            >size
            >style
            >weight
            >family
            >etc...
      </pre>
    </p>
  </body>
</html>
