<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer-Registration Page</title>
    <link rel="stylesheet" href="/CSS/style.css">
</head>
<body>
    <section id="mainWrapper">
        <section class="form">
            <h2>Create Your Account</h2>
            <form action="">
            <label for="fullname">Full Name</label><br>
            <input type="text" name="fullname" id="fullname"><br><br>

            <label for="mobilenumber">Mobile Number</label><br>
            <input type="text" name="mobilenumber" id="mobilenumber"><br><br>

            <label for="email">Email</label><br>
            <input type="email" name="email" id="email"><br><br>

            <label for="password">Password</label><br>
            <input type="password" name="password" id="password"><br><br>

            <label for="companyname">Company Name</label><br>
            <input type="text" name="companyname" id="companyname"><br><br>

            <label for="deliveryaddress">Delivery Address</label><br>
            <input type="text" name="deliveryaddress" id="deliveryaddress"><br><br>

            <button type="submit">Register</button><br><br>

            <p>Already have an account? <a href="#">Login</a></p>
        </form>
        </section>
    </section>
</body>
</html>
