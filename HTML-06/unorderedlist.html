<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>Un-ordered List without type parameter</p>
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JAVASCRIPT</li>
        <li>DOM</li>
    </ul>
    <hr>

    <p>Un-ordered List type "disc"</p>
    <ul type="disc">
        <li>HTML</li>
        <li>CSS</li>
        <li>JAVASCRIPT</li>
        <li>DOM</li>
    </ul>
    <hr>

    <p>Un-ordered List type "circle"</p>
    <ul type="circle">
        <li>HTML</li>
        <li>CSS</li>
        <li>JAVASCRIPT</li>
        <li>DOM</li>
    </ul>
    <hr>

    <p>Un-ordered List type "square"</p>
    <ul type="square">
        <li>HTML</li>
        <li>CSS</li>
        <li>JAVASCRIPT</li>
        <li>DOM</li>
    </ul>
    <hr>

</body>
</html>
