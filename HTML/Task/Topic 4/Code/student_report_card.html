<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="1" cellpadding="10" cellspacing="0">
        <caption>Class 10 Report</caption>
        <!-- Table head -->
        <thead>
            <tr>
                <th>Subject</th>
                <th>Max Marks</th>
                <th>Marks Obtained</th>
                <th>Grade</th>
            </tr>
        </thead>

        <!-- Table body -->
        <tr>
            <td>Mathematics</td>
            <td  rowspan="5" align="center"><strong>100</strong></td>
            <td>95</td>
            <td>A+</td>
        </tr>

        <tr>
            <td>Science</td>
            <td>89</td>
            <td>A</td>
        </tr>

        <tr>
            <td>English</td>
            <td>92</td>
            <td>A+</td>
        </tr>

        <tr>
            <td>History</td>
            <td>85</td>
            <td>B+</td>
        </tr>

        <tr>
            <td>Computer</td>
            <td>98</td>
            <td>A+</td>
        </tr>

        <!-- Table footer -->
        <tfoot>
            <td colspan="2"><strong>Total/Percentage</strong></td>
            <td><strong>459/500</strong></td>
            <td><strong>91.8%</strong></td>
        </tfoot>
    </table>
</body>
</html>
