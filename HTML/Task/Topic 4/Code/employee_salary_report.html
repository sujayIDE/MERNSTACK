<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="1" cellpadding="10" cellspacing="0">
        <caption><strong>Employee Salary Summary - 2025</strong></caption>
        <!-- Table head -->
    <thead>
        <tr>
            <th rowspan="2">Department</th>
            <th rowspan="2">Employee Name</th>
            <th colspan="3">Quaterly Salary(USD)</th>
            <th rowspan="2">Total</th>
        </tr>

        <tr>
            <td>Q1</td>
            <td>Q2</td>
            <td>Q3</td>
        </tr>
    </thead>

    <!-- Table body -->
    <tbody>
        <tr>
            <td rowspan="2">Engineering</td>
            <td>John Doe</td>
            <td>4000</td>
            <td>4200</td>
            <td>4100</td>
            <td>12300</td>
        </tr>
        <tr>
            <td>Sarah Lee</td>
            <td>3800</td>
            <td>4000</td>
            <td>4100</td>
            <td>11900</td>
        </tr>

         <tr>
            <td rowspan="2">Marketing</td>
            <td>David Kin</td>
            <td>3000</td>
            <td>3100</td>
            <td>3050</td>
            <td>9150</td>
        </tr>
        <tr>
            <td>Alice Wong</td>
            <td>2900</td>
            <td>2950</td>
            <td>3000</td>
            <td>8850</td>
        </tr>
    </tbody>

    <!-- Table footer -->
    <tfoot>
        <tr>
            <th colspan="5">Grand Total</th>
            <th>42200</th>
        </tr>
    </tfoot>
    </table>
</body>
</html>
