<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form action="">
      <section>
        <label for="name">Name:</label>
        <input type="text" name="name" id="name" />
      </section>
      <br />

      <section>
        <label for="age">Age:</label>
        <input type="number" name="age" id="age" />
      </section>
      <br />

      <section>
        <label for="color">Favourite Color:</label>
        <input type="color" name="color" id="color" />
      </section>
      <br />

      <section>
        <label for="rating">Rating:</label>
        <input type="range" name="rating" id="rating" min="1" max="10" />
      </section>
      <br />

      <section>
        <label for="">Hobbies:</label>
        <input type="checkbox" name="hobby" id="cricket" value="cricket"/>
        <label for="cricket">Cricket</label>
        <input type="checkbox" name="hobby" id="reading" value="reading" />
        <label for="reading">Reading</label>
        <input type="checkbox" name="hobby" id="videogames" value="videogames" />
        <label for="videogames">Video Games</label>
        <input type="checkbox" name="hobby" id="writing"  value="writing"/>
        <label for="writing">Writing</label>
      </section>
      <br /><br />

      <section>
        <label for="country">Select Country: </label>
        <select name="country" id="country">
          <option selected disabled>--Select Country--</option>
          <option value="india">India</option>
          <option value="usa">United States</option>
          <option value="uk">United Kingdom</option>
          <option value="canada">Canada</option>
          <option value="australia">Australia</option>
          <option value="germany">Germany</option>
          <option value="france">France</option>
          <option value="italy">Italy</option>
          <option value="japan">Japan</option>
          <option value="china">China</option>
          <option value="russia">Russia</option>
          <option value="brazil">Brazil</option>
          <option value="mexico">Mexico</option>
          <option value="south-africa">South Africa</option>
          <option value="singapore">Singapore</option>
          <option value="new-zealand">New Zealand</option>
          <option value="nepal">Nepal</option>
        </select>
      </section>
      <br />

      <section>
        <label for="comment">Comments:</label><br />
        <textarea name="comment" id="comment"></textarea>
      </section>
      <br />

      <section>
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
      </section>
    </form>
  </body>
</html>
