<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- <h1> is used for the main heading of the page. -->
    <h1>Heading 1</h1>

    <!-- <h2> is used for major sections under the main heading. -->
    <h2>Heading 2</h2>

    <!-- <h3> is used for subsections under an <h2> heading. -->
    <h3>Heading 3</h3>

    <!-- <h4> is used for smaller sections under an <h3> heading. -->
    <h4>Heading 4</h4>

    <!-- <h5> is used for further sub-sections. -->
    <h5>Heading 5</h5>

    <!-- <h6> is used for the smallest/least important heading level. -->
    <h6>Heading 6</h6>
  </body>
</html>
