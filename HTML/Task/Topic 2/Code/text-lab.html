    <h2>Formatting Practice Zone</h2>

    <b>Bold--</b>purely visual;<strong>Strong--</strong>add importance <br><br>

    <i>Italic--</i>for style;<em>Emphasized--</em>gives stress or meaning <br><br>

    <u>Underline--</u>draw attention. <br><br>

    <mark>Mark--</mark>highlight text <br><br>

    <small>Small--</small>show less important text <br><br>
