<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <table border="1" width="100%" cellpadding="10px" cellspacing="0">
      <caption>
        Weekly Study Schedule
      </caption>
      <thead>
        <tr>
        <th>Time</th>
        <th>Monday</th>
        <th>Tuesday</th>
        <th>Wednesday</th>
        <th>Thursday</th>
        <th>Friday</th>
      </tr>
      </thead>

      <tbody>
        <tr>
        <td>9-10 AM</td>
        <td>Math</td>
        <td>Science</td>
        <td>English</td>
        <td>Math</td>
        <td>Geography</td>
      </tr>

      <tr>
        <td>10-11 AM</td>
        <td>Physics</td>
        <td>History</td>
        <td>Math</td>
        <td>Science</td>
        <td>Art</td>
      </tr>

      <tr>
        <td>11-12 </td>
        <th colspan="5">Lunch Time</th>
      </tr>

      <tr>
        <td>12-1 pm</td>
        <td rowspan="2" align="center">Chemistry</td>
        <td>Sport</td>
        <td>Computer</td>
        <td>English</td>
        <td rowspan="2" align="center">Music</td>
      </tr>

       <tr>
        <td>1-2 pm</td>
        <td>English</td>
        <td>Computer</td>
        <td>Sport</td>
      </tr>
      </tbody>
    </table>
  </body>
</html>
